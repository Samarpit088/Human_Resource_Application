version: '3.8'

# Production Docker Compose - Uses AWS RDS, Cloud Redis, and pre-built image from Docker Hub
services:
  # Spring Boot Application Service (from Docker Hub, connects to AWS RDS + Cloud Redis)
  app:
    image: ${DOCKER_USERNAME}/hr-application:latest
    container_name: hr_application_prod
    restart: always
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Database Configuration (AWS RDS from .env)
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # JPA/Hibernate Configuration
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JPA_HIBERNATE_DDL_AUTO: ${JPA_HIBERNATE_DDL_AUTO:-validate}
      
      # Server Configuration
      SERVER_PORT: 8080
      
      # Redis Configuration (Cloud Redis from .env)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      # Java Options for production
      JAVA_OPTS: "-Xmx1024m -Xms512m -XX:+UseG1GC"
    networks:
      - hr_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  hr_network:
    driver: bridge
