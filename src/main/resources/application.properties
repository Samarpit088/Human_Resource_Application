spring.application.name=Human_Resource_Managment

# =========================================================
# DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hr?useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# HIKARI CONNECTION POOL (IMPORTANT)
# =========================================================

spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}

# IMPORTANT: disable SQL logs in production/load testing
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate performance tuning
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# =========================================================
# SERVER CONFIGURATION
# =========================================================

server.port=${SERVER_PORT:8080}

# =========================================================
# TOMCAT PERFORMANCE TUNING
# =========================================================

server.tomcat.threads.max=400
server.tomcat.accept-count=200
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=20000

# =========================================================
# RESPONSE COMPRESSION
# =========================================================

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# =========================================================
# REDIS CONFIGURATION
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000

spring.cache.type=redis

# Redis connection pool
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=30000

# =========================================================
# SPRING DATA REST
# =========================================================

spring.data.rest.base-path=/api/v1
spring.data.rest.default-page-size=20
spring.data.rest.max-page-size=100

# =========================================================
# CORS CONFIGURATION
# =========================================================

cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

# =========================================================
# JACKSON OPTIMIZATION
# =========================================================

spring.jackson.serialization.fail-on-empty-beans=false

# =========================================================
# ACTUATOR (OPTIONAL BUT RECOMMENDED)
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always